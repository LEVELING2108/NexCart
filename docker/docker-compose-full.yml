version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: nexcart-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_db
    networks:
      - nexcart-network

  redis:
    image: redis:7-alpine
    container_name: nexcart-redis
    ports:
      - "6379:6379"
    networks:
      - nexcart-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nexcart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - nexcart-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nexcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nexcart-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: nexcart-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - nexcart-network

  prometheus:
    image: prom/prometheus
    container_name: nexcart-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - nexcart-network

  grafana:
    image: grafana/grafana
    container_name: nexcart-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - nexcart-network

  zipkin:
    image: openzipkin/zipkin
    container_name: nexcart-zipkin
    ports:
      - "9411:9411"
    networks:
      - nexcart-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: nexcart-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - nexcart-network

  # Microservices
  service-registry:
    build:
      context: ./service-registry
      dockerfile: ../Dockerfile
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - nexcart-network

  config-server:
    build:
      context: ./config-server
      dockerfile: ../Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - service-registry
    networks:
      - nexcart-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
    networks:
      - nexcart-network

  user-service:
    build:
      context: ./user-service
      dockerfile: ../Dockerfile
    container_name: user-service
    depends_on:
      - config-server
      - postgres
      - kafka
    networks:
      - nexcart-network

  product-service:
    build:
      context: ./product-service
      dockerfile: ../Dockerfile
    container_name: product-service
    depends_on:
      - config-server
      - postgres
      - elasticsearch
    networks:
      - nexcart-network

  order-service:
    build:
      context: ./order-service
      dockerfile: ../Dockerfile
    container_name: order-service
    depends_on:
      - config-server
      - postgres
      - kafka
    networks:
      - nexcart-network

networks:
  nexcart-network:
    driver: bridge
